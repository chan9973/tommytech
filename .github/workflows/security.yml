# TommyTech Security Scanning Pipeline
# Runs CodeQL static analysis + gitleaks secret scanning on every PR and daily.

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 9 * * 1"   # Every Monday 09:00 UTC

permissions:
  security-events: write  # For uploading CodeQL results
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ─── CodeQL Static Analysis ───
  codeql:
    name: "CodeQL Analysis"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          uploads: true

      - name: Perform CodeQL build
        uses: github/codeql-action/analyze@v3
        with:
          category: "codeql"

  # ─── GitLeaks Secret Scanning ───
  gitleaks:
    name: "GitLeaks Secret Scan"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          output_report: github
          additional_args: --report-format=github --verbose

  # ─── Dependency Vulnerability Scan ───
  dependency-scan:
    name: "Dependency Vulnerability Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt 2>/dev/null || echo "No requirements.txt found"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high --json || true

      - name: Upload npm audit results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: npm-audit.sarif

  # ─── SBOM Generation ───
  sbom:
    name: "Software Bill of Materials"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: tommytech-sbom
          path: sbom/
          retention-days: 30
