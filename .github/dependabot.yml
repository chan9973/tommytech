# TommyTech Dependabot — GitHub-native config at repo root
# Updates for ALL dependencies (github-actions, pip, npm, etc.)
version: 2

# ===== GitHub Actions — security-critical, auto-update patch versions =====
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Kuala_Lumpur'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      # Group non-major action updates
      github-actions-non-major:
        priority: 0
        update-types:
          - 'minor'
          - 'patch'

  # ===== Node.js (npm) =====
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'Asia/Kuala_Lumpur'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'

  # ===== Python (pip) =====
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
      timezone: 'Asia/Kuala_Lumpur'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'chore(deps)'
    allow:
      - dependency-type: 'direct'

  # ===== Docker =====
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'thursday'
      time: '09:00'
      timezone: 'Asia/Kuala_Lumpur'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore(deps)'

  # ===== GitHub Actions SECURITY-only — daily for high-severity CVEs =====
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '06:00'
      timezone: 'Asia/Kuala_Lumpur'
    open-pull-requests-limit: 5
    labels:
      - 'security'
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps): security'
    allow:
      - dependency-type: 'all'
    reviewers:
      - 'tommy'
    target-branch: 'main'
