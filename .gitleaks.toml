# https://gitleaks.com/  ── Secret scanning configuration for TommyTech
#
# Used by:
#   1. The `gitleaks` CLI in pre-commit hooks
#   2. The `gitleaks-action` in CI (.github/workflows/security.yml)

title = "TommyTech Secret Scanning"

# ─── Detection rules ───

[[rules]]
description = "TommyTech internal API keys (prefix ttk_)"
regex = '''ttk_[a-zA-Z0-9]{32}'''
tags = ["internal", "api-key"]

[[rules]]
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "credentials"]

[[rules]]
description = "AWS Secret Access Key"
regex = '''aws_secret_access_key\s*=\s*['\"][0-9a-zA-Z/+]{40}['\"]'''
tags = ["aws", "credentials"]

[[rules]]
description = "Generic API key assignment"
regex = '''(api[_-]?key|API[_-]?KEY)\s*[:=]\s*['\"][a-zA-Z0-9]{32,}['\"]'''
tags = ["api-key", "generic"]

[[rules]]
description = "Generic password assignment"
regex = '''(password|passwd|pwd)\s*[:=]\s*['\"][^'"]{8,}['\"]'''
tags = ["password", "generic"]

[[rules]]
description = "GitHub Personal Access Token"
regex = '''ghp_[a-zA-Z0-9]{36}'''
tags = ["github", "token"]

[[rules]]
description = "Private key block"
regex = '''-----BEGIN (?:(RSA |EC |DSA |OPENSSH )?PRIVATE KEY|PGP MESSAGE)-----'''
tags = ["private-key", "credentials"]

# ─── Allowlist ───

[allowlist]
description = "TommyTech allowlist for test fixtures and documentation"
paths = [
    '''tests/fixtures/''',
    '''docs/examples/''',
    '''examples/''',
]
regexes = [
    '''example[-_]?token''',
    '''fake[-_]?api[-_]?key''',
    '''placeholder''',
    '''eyJ[A-Za-z0-9_-]{10}\.eyJ[A-Za-z0-9_-]{10}\.[A-Za-z0-9_-]{10}''',  # example JWT
]
