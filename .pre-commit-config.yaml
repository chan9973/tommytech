# TommyTech Pre-commit Hooks
# Install: pre-commit install
# Update:  pre-commit autoupdate

repos:
  # ── Local hooks ──
  - repo: local
    hooks:
      - id: check-merge-conflicts
        name: "Check for merge conflicts"
        entry: "grep"
        args: ["-rn", "--include=*", "^<<<<<<< HEAD"]
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks
        name: "gitleaks (secret scanning)"
        entry: "gitleaks protect --verbose --config .gitleaks.toml --no-git-check"
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ── End-of-file fixer ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
        args: ["--allow-keys"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Prettier ──
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.4.0
    hooks:
      - id: prettier
        types_or: [javascript, typescript, ts, js, css, scss, html, json, yaml, markdown]
        args: ["--check"]

  # ── ESLint ──
  - repo: https://github.com/eslint/eslint
    rev: v9.1.1
    hooks:
      - id: eslint
        args: ["--fix"]

  # ── Flake8 (Python) ──
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E203,W503"]

  # ── Bandit (Python security) ──
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]

  # ── GitLeaks ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: detect-secrets
        args: ["--config=.gitleaks.toml", "--verbose"]

  # ── Checkov (IaC scanning) ──
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.0
    hooks:
      - id: checkov
        args: ["--soft-fail"]
        files: \.(tf|yaml|yml|json|dockerfile)$
